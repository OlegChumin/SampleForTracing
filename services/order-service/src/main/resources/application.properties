spring.application.name=order-service
server.port=8081

client.inventory-service.base-url=http://localhost:8082
client.pricing-service.base-url=http://localhost:8083
client.payment-service.base-url=http://localhost:8084

management.endpoints.web.exposure.include=health,info,beans
management.endpoint.health.probes.enabled=true
spring.boot.admin.client.url=http://localhost:9090
spring.boot.admin.client.instance.service-base-url=http://localhost:${server.port}
spring.boot.admin.client.instance.management-base-url=http://localhost:${server.port}

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

checkout.kafka.topics.order-created=checkout.order-created
checkout.kafka.topics.order-completed=checkout.order-completed

opentracing.jaeger.enabled=true
opentracing.jaeger.service-name=${spring.application.name}
opentracing.jaeger.http-sender.url=http://localhost:14268/api/traces
opentracing.jaeger.log-spans=false
opentracing.jaeger.const-sampler.decision=true

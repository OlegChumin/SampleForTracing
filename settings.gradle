pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

rootProject.name = 'SampleForTracing'

include 'api-gateway'
include 'order-service'
include 'inventory-service'
include 'pricing-service'
include 'payment-service'

project(':api-gateway').projectDir = file('services/api-gateway')
project(':order-service').projectDir = file('services/order-service')
project(':inventory-service').projectDir = file('services/inventory-service')
project(':pricing-service').projectDir = file('services/pricing-service')
project(':payment-service').projectDir = file('services/payment-service')
